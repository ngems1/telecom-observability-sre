# CI/CD for the telecom platform (brief section 5: Enterprise CI/CD baseline).
#
#   Pull request:  test -> lint -> Helm validation -> IaC validation -> security scans -> image build + scan
#   Push to main:  all of the above, then push the SHA-tagged images to ECR (GitHub OIDC, no AWS keys)
#                  and deploy to dev with Helm (GitHub Environment "dev": add required reviewers for approval),
#                  smoke test, automatic rollback on failure. Prod follows dev when ENABLE_PROD_DEPLOY is true.
#
# One-time setup (see docs/runbooks/deploy-and-rollback.md):
#   Repository variables:   AWS_REGION, AWS_ECR_PUSH_ROLE_ARN      (terraform output github_ecr_push_role_arn)
#   Environment "dev":      variable AWS_DEPLOY_ROLE_ARN           (terraform output github_deploy_role_arn)
#   Environment "prod":     variable AWS_DEPLOY_ROLE_ARN, and repository variable ENABLE_PROD_DEPLOY=true
# Without AWS_ECR_PUSH_ROLE_ARN the pipeline still runs every check and build, and skips push/deploy.
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  HELM_VERSION: v3.16.4   # Helm 3: the deploy flags below (--atomic) are Helm 3 syntax

jobs:
  # ---------------------------------------------------------------- 1. tests + lint
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [usage-api, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff
      - name: Lint (ruff)
        run: ruff check --output-format=github app tests
      - name: Unit and integration tests (pytest, SQS mocked with moto)
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/test-results.xml

  # ---------------------------------------------------------------- 2. Helm validation
  helm:
    name: helm lint + schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint (defaults, dev, prod)
        run: |
          helm lint charts/telecom-app --strict
          helm lint charts/telecom-app --strict -f charts/telecom-app/values-dev.yaml -f .github/ci/helm-values-aws.yaml
          helm lint charts/telecom-app --strict -f charts/telecom-app/values-prod.yaml -f .github/ci/helm-values-aws.yaml
      - name: Render manifests as they would be deployed
        run: |
          mkdir -p rendered
          for env in dev prod; do
            helm template telecom charts/telecom-app --namespace "telecom-${env}" \
              -f "charts/telecom-app/values-${env}.yaml" -f .github/ci/helm-values-aws.yaml \
              --set usageApi.image.tag=ci --set notificationService.image.tag=ci > "rendered/${env}.yaml"
          done
      - name: Validate against Kubernetes and CRD schemas (kubeconform)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/

  # ---------------------------------------------------------------- 3. IaC validation
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform
      - name: terraform validate (main stack)
        working-directory: terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: terraform validate (state bootstrap)
        working-directory: terraform/bootstrap
        run: terraform init -backend=false -input=false && terraform validate

  # ---------------------------------------------------------------- 4. security scans
  security:
    name: security scans (Trivy + Checkov)
    runs-on: ubuntu-latest
    needs: helm
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rendered-manifests
          path: rendered
      - name: Trivy repo scan (secrets, IaC misconfigurations, dependencies) - report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-repo.sarif
          exit-code: "0"
      - name: Upload Trivy repo results to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo
      - name: Trivy gate - committed secrets fail the build
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
      - name: Checkov (Terraform, rendered Kubernetes manifests, Dockerfiles, workflows)
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml
          soft_fail: true          # findings are reported and triaged (docs/security.md); not yet a gate
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
      - name: Upload Checkov results to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ---------------------------------------------------------------- 5. build, scan, publish
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, helm, terraform, security]
    permissions:
      contents: read
      id-token: write          # OIDC token for the ECR push role
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [usage-api, notification-service]
    env:
      IMAGE: telecom/${{ matrix.service }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ECR_PUSH_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan (OS + Python packages) - report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
      - name: Upload image scan to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}
      - name: Trivy gate - fixable CRITICAL vulnerabilities block the release
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
      - name: Configure AWS credentials (OIDC, short-lived)
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Log in to ECR
        id: ecr
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push to ECR (immutable tags; an existing SHA is not pushed again)
        if: env.PUBLISH == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TARGET="${REGISTRY}/${IMAGE}:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "$TARGET already exists (tags are immutable): reusing it."
          else
            docker tag "${IMAGE}:${GITHUB_SHA}" "$TARGET"
            docker push "$TARGET"
          fi
          echo "Published \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 6. deploy
  deploy-dev:
    name: deploy dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ECR_PUSH_ROLE_ARN != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image-tag: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write

  deploy-prod:
    name: deploy prod
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PROD_DEPLOY == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image-tag: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write
