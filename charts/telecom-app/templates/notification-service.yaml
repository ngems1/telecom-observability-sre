{{- if .Values.notificationService.enabled }}
{{- $svc := .Values.notificationService }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/component: worker
    {{- include "telecom-app.labels" . | nindent 4 }}
spec:
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/component: worker
        {{- include "telecom-app.labels" . | nindent 8 }}
    spec:
      serviceAccountName: notification-service
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: notification-service
      # Long enough for the worker to finish its current message and stop polling.
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notification-service
          image: {{ include "telecom-app.image" (dict "root" . "svc" $svc) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: SERVICE_NAME
              value: notification-service
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            - name: AWS_REGION
              value: {{ .Values.global.region | quote }}
            - name: LOG_LEVEL
              value: {{ $svc.config.logLevel | quote }}
            - name: SQS_QUEUE_URL
              value: {{ $svc.config.sqsQueueUrl | quote }}
            {{- if $svc.config.sqsEndpointUrl }}
            - name: SQS_ENDPOINT_URL
              value: {{ $svc.config.sqsEndpointUrl | quote }}
            {{- end }}
            - name: SQS_WAIT_SECONDS
              value: {{ $svc.config.waitSeconds | quote }}
            - name: WORKER_STALE_SECONDS
              value: {{ $svc.config.staleSeconds | quote }}
            - name: CHAOS_ENABLED
              value: {{ $svc.chaos.enabled | quote }}
            - name: OTEL_ENABLED
              value: {{ $svc.config.otelEnabled | quote }}
            {{- if .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # Liveness fails if the consumer loop stops iterating (worker thread dead or wedged).
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Exposes probes and /metrics inside the cluster only (the consumer has no public API).
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    {{- include "telecom-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- if $svc.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    {{- include "telecom-app.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: {{ $svc.autoscaling.minReplicas }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
    {{- include "telecom-app.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $svc.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
{{- end }}
