{{- if and .Values.loadgen.enabled .Values.usageApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/component: synthetic-traffic
    {{- include "telecom-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/component: synthetic-traffic
        {{- include "telecom-app.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: loadgen
          # Same image as the API: tools/loadgen.py ships inside it.
          image: {{ include "telecom-app.image" (dict "root" . "svc" .Values.usageApi) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "tools/loadgen.py"]
          args:
            - --base-url
            - http://usage-api:{{ .Values.usageApi.port }}
            - --rps
            - {{ .Values.loadgen.rps | quote }}
          resources:
            {{- toYaml .Values.loadgen.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
