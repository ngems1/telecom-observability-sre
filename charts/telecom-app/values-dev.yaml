# Dev namespace: failure injection and synthetic traffic on, small footprint, tracing on.
global:
  environment: dev

otel:
  endpoint: http://tempo.monitoring.svc.cluster.local:4317

networkPolicy:
  enabled: true

usageApi:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
  podDisruptionBudget:
    minAvailable: 0   # single replica in dev: don't block node drains
  config:
    logLevel: DEBUG
    otelEnabled: true
  chaos:
    enabled: true

notificationService:
  replicaCount: 1
  podDisruptionBudget:
    minAvailable: 0
  config:
    logLevel: DEBUG
    otelEnabled: true
  chaos:
    enabled: true

loadgen:
  enabled: true
  rps: 5

monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
  grafanaDashboards:
    enabled: true
